name: tests

on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
        python: ["3.10", "3.12", "3.13"]
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python }}
      - name: Install
        run: pip install '.[cutout]'
      - name: Test (no network, no API key needed)
        run: python -m unittest discover -s tests -v
      - name: CLI smoke test
        run: |
          falg --version
          falg models
          falg run examples/styles.json --dry-run
